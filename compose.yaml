services:
  postgres:
    image: postgres:18
    container_name: simulador_postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d simulador_banco"]
      interval: 5s
      timeout: 5s
      retries: 10

    environment:
      POSTGRES_DB: simulador_banco
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"
    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql


  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: simulador-banco:1.0

    container_name: simulador-banco-api

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/simulador_banco
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
